<title>Status Kontrak Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sidebar kiri + topbar sticky + area kerja berisi kartu (gaya MD3 gelap, aksen teal). Satu tema gelap, sesuai spec §10 (tema terang = "Nanti"). */
:root{
  color-scheme:dark;
  --bg:#0e1416; --surface:#151c1e; --surface2:#1b2427; --surface3:#223033; --outline:#2a3739; --outline2:#36474a;
  --fg:#dbe5e5; --muted:#8ea1a2; --dim:#64787a;
  --accent:#4fd1c1; --accent-strong:#7ae6d8; --on-accent:#00201c; --accent-bg:rgba(79,209,193,.12);
  --ok:#62cc8e; --ok-bg:rgba(98,204,142,.13); --warn:#e7b54d; --warn-bg:rgba(231,181,77,.13);
  --crit:#ef7470; --crit-bg:rgba(239,116,112,.13); --info:#86a8ff; --info-bg:rgba(134,168,255,.13);
  --fresh:#4fd1c1; --warm:#e7cf4d; --stale:#ec9a4a; --cold:#ef7470;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","SFMono-Regular",Menlo,monospace;
  --r:12px; --r-sm:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)} .dim{color:var(--dim)}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
svg.i.s{width:16px;height:16px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--outline);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-block:14px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 16px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;letter-spacing:.3px;font-size:11px;flex:none}
.brand b{display:block;font-size:14px;line-height:1.15}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface2);color:var(--fg)}
.nav a.on{background:var(--accent-bg);color:var(--accent-strong)}
.nav .cnt{margin-left:auto;font-size:11.5px;background:var(--surface3);color:var(--fg);border-radius:999px;padding:1px 8px}
.nav a.on .cnt{background:var(--accent);color:var(--on-accent)}
.navlbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:14px 12px 6px}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--outline);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,20,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--outline);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top h1{font-size:18px;margin:0;font-weight:600;text-wrap:balance}
.top .crumb{color:var(--muted);font-size:12.5px}
.top .sp{flex:1}
.mock{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--warn);color:var(--warn);padding:3px 8px;border-radius:6px;white-space:nowrap}
.iconbtn{background:none;border:0;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer;position:relative}
.iconbtn:hover{background:var(--surface2);color:var(--fg)}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface2);cursor:pointer;border:0}
.av{width:28px;height:28px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--accent-strong)}
.burger{display:none}
.content{padding-block:20px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.card h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gd{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--outline);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:650;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--dim);margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;border:1px solid var(--outline2);background:transparent;color:var(--fg);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-strong)}
.btn.ton{background:var(--accent-bg);border-color:transparent;color:var(--accent-strong)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp,select.inp,textarea.inp{background:var(--surface2);border:1px solid var(--outline2);border-radius:var(--r-sm);padding:7px 10px;min-width:0}
textarea.inp{width:100%;min-height:70px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none}
.search{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--outline2);border-radius:999px;padding:5px 12px;flex:1 1 240px;min-width:0}
.search input{background:none;border:0;outline:0;flex:1;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f > .inp{color:var(--fg);font-size:13.5px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface3);color:var(--fg)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-crit{background:var(--crit-bg);color:var(--crit)} .p-info{background:var(--info-bg);color:var(--info)}
.p-acc{background:var(--accent-bg);color:var(--accent-strong)} .p-dim{background:var(--surface2);color:var(--muted)}
.ku{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;border-radius:6px;padding:2px 7px;white-space:nowrap;display:inline-block}

.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--outline);white-space:nowrap;background:var(--surface)}
.t td{padding:9px 10px;border-bottom:1px solid var(--outline);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--surface2)}
.t td.num,.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.t .no{font-family:var(--mono);font-size:12px;color:var(--fg)}
.t .sub{display:block;font-size:12px;color:var(--muted);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.agebar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface3);min-width:120px}
.agebar i{display:block;height:100%}
.age{font-size:11.5px;border-radius:6px;padding:1px 7px;font-weight:600;white-space:nowrap}
.a-fresh{background:rgba(79,209,193,.14);color:var(--fresh)} .a-warm{background:rgba(231,207,77,.14);color:var(--warm)}
.a-stale{background:rgba(236,154,74,.14);color:var(--stale)} .a-cold{background:rgba(239,116,112,.14);color:var(--cold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:13px}
.hb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.hb .fill{height:100%;background:var(--accent);border-radius:4px}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

.syncs{display:grid;gap:10px}
.sync{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface2)}
.sync .st{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}

/* detail */
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.bast{border:1px solid var(--outline);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface2)}
.bast-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bast-h b{font-family:var(--mono);font-size:13px}
.stepper{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.step{flex:1 1 0;min-width:96px;border:0;text-align:left;cursor:pointer;background:var(--surface3);border-radius:6px;padding:7px 9px 8px;color:var(--muted);font-size:11.5px;line-height:1.25;position:relative}
.step:hover{color:var(--fg)}
.step .u{font-size:10.5px;color:var(--dim);display:block}
.step.done{background:rgba(79,209,193,.18);color:var(--accent-strong)}
.step.cur{background:var(--accent);color:var(--on-accent)}
.step.cur .u{color:rgba(0,32,28,.65)}
.step.closer.done,.step.closer.cur{background:var(--ok);color:#06210f}
.push{display:flex;flex-direction:column;gap:10px}
.pushrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:baseline;font-size:13px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface2)}
.pushrow .k{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pushrow .v{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.tl{display:flex;flex-direction:column;gap:0;font-size:13px}
.tl .e{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px dashed var(--outline)}
.tl .e:last-child{border:0}
.tl .w{color:var(--dim);font-size:12px}
.kend{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface2);border-left:3px solid var(--crit)}
.kend.done{border-left-color:var(--outline2);opacity:.7}
.note{padding:10px 12px;border-radius:var(--r-sm);font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.info{background:var(--info-bg);color:var(--info)}
.note.ok{background:var(--ok-bg);color:var(--ok)} .note.crit{background:var(--crit-bg);color:var(--crit)}
.note .tx{color:var(--fg)} .note b{color:inherit}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--outline);overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs a.on{color:var(--accent-strong);border-bottom-color:var(--accent)}
.bulk{position:sticky;bottom:12px;background:var(--surface3);border:1px solid var(--outline2);border-radius:999px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 8px 28px rgba(0,0,0,.4)}
.wiz-steps{display:flex;gap:6px;flex-wrap:wrap}
.wiz-steps span{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:12.5px}
.wiz-steps span i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface3);font-style:normal;font-size:11.5px;font-weight:700}
.wiz-steps span.on{color:var(--accent-strong);background:var(--accent-bg)}
.wiz-steps span.on i{background:var(--accent);color:var(--on-accent)}
.wiz-steps span.done i{background:var(--ok);color:#06210f}
.chk{width:16px;height:16px;accent-color:var(--accent)}
.toggle{width:34px;height:20px;border-radius:10px;background:var(--surface3);border:1px solid var(--outline2);position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:left .15s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on::after{left:16px;background:var(--on-accent)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--outline2);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-size:17px;font-weight:600}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.notif{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:56px;width:min(400px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--outline2);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:40;overflow:hidden}
.notif-h{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--outline)}
.notif-i{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--outline);cursor:pointer;font-size:13px}
.notif-i:hover{background:var(--surface2)}
.notif-i.read{opacity:.55}
.notif-i .w{font-size:11.5px;color:var(--dim);margin-top:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--surface3);border:1px solid var(--outline2);padding:10px 16px;border-radius:10px;z-index:60;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(1200px 600px at 20% -10%,rgba(79,209,193,.10),transparent 60%),var(--bg)}
.login .card{width:min(400px,100%);padding:28px;display:flex;flex-direction:column;gap:14px}
.login .inp{width:100%}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.gd,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:45;width:250px;transform:translateX(-105%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .burger{display:grid}
  .g2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top .crumb,.me .nm{display:none}
  .hb{grid-template-columns:minmax(0,120px) minmax(0,1fr) 30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ============ Logika domain (di aplikasi asli: Domain.gs, fungsi murni + unit test) ============ */
const tah=k=>TAHAP.find(t=>t.kode===k);
const tahLabel=k=>tah(k)?.label??k;
const closer=()=>TAHAP.find(t=>t.penutup&&t.aktif);
const bastClose=b=>!!tah(b.t)?.penutup;
const activeKend=k=>k.kend.filter(x=>x.st==='AKTIF');
function statusK(k){
  if(!k.bast.length) return {st:'OPEN',belum:true,sisa:false,cak:0};
  const all=k.bast.every(bastClose);
  const cak=k.bast.reduce((a,b)=>a+(b.cak||0),0);
  if(all&&(!k.lok||cak>=k.lok)) return {st:'CLOSE',sisa:false,cak};
  if(all) return {st:'OPEN',sisa:true,cak};
  return {st:'OPEN',sisa:false,cak};
}
function tahapK(k){
  const open=k.bast.filter(b=>!bastClose(b));
  if(!open.length) return k.bast.length?closer().kode:null;
  return open.slice().sort((a,b)=>tah(a.t).urut-tah(b.t).urut)[0].t;
}
function bottleneck(k){const open=k.bast.filter(b=>!bastClose(b));return open.sort((a,b)=>tah(a.t).urut-tah(b.t).urut)[0];}
function evalPush(k){
  const s=statusK(k), tk=tahapK(k), ak=activeKend(k);
  for(let i=0;i<RULES.length;i++){
    const r=RULES[i]; if(!r.aktif) continue;
    let hit=null;
    if(r.k==='CLOSE'&&s.st==='CLOSE') hit='tahap';
    else if(r.k==='SISA_LOKASI'&&s.sisa) hit='tahap';
    else if(r.k==='BELUM_ADA_BAST'&&s.belum) hit='tahap';
    else if(r.k.startsWith('TAHAP:')&&s.st!=='CLOSE'&&!s.sisa&&tk===r.k.slice(6)) hit='tahap';
    else if(r.k.startsWith('KENDALA:')){const c=r.k.slice(8);const m=ak.find(x=>c==='*'||x.j===c);if(m) hit=m;}
    if(hit){
      let detil;
      if(hit==='tahap'){const lb=k.bast[k.bast.length-1];detil=lb?lb.ket:'';const o=ak.length;if(o)detil+=` (+${o})`;}
      else{detil=hit.ket;const o=ak.length-1;if(o>0)detil+=` (+${o})`;}
      return {i,r,umum:r.v,detil};
    }
  }
  return {i:-1,r:null,umum:null,detil:null};
}
const bucket=h=>h<=AGING[0]?'fresh':h<=AGING[1]?'warm':h<=AGING[2]?'stale':'cold';
const BLBL={fresh:'Fresh',warm:'Warm',stale:'Stale',cold:'Cold'};
const agingK=k=>{const b=bottleneck(k);if(b)return b.hari;if(statusK(k).sisa)return k.bast[k.bast.length-1].hari;return null;};
function parsialTxt(k){if(k.bast.length<2&&!k.lok)return '—';const c=k.bast.filter(bastClose).length;const s=statusK(k);return `${c}/${k.bast.length} BAST`+(k.lok?` · ${s.cak}/${k.lok} lokasi`:'');}

function cekTarget(t){
  const rows=SHEETROWS[t.id],out=[],alarms=[],antri=[];
  rows.forEach(r=>{
    const nk=normKey(r.raw);
    if(/\/\s|\s\//.test(r.raw)&&r.raw.split(/\s\/\s/).length>1){alarms.push({j:'MULTI_NOMOR',b:r.baris,txt:`Sel berisi lebih dari satu nomor: "${r.raw}". Tidak ditulis.`});return;}
    const k=K.find(x=>normKey(x.no)===nk)||(nk===normKey('TEL 0317-0016/P8/LG.270/DES-A2027000/2017')?K[0]:null);
    if(!k){antri.push({b:r.baris,no:r.raw});return;}
    const p=evalPush(k),s=statusK(k);
    if(r.formula){alarms.push({j:'FORMULA',b:r.baris,txt:`Sel tujuan berisi formula (${r.now}). Tidak ditimpa.`});return;}
    if(s.st==='CLOSE'&&r.closedWritten){out.push({b:r.baris,k,now:r.now,next:r.now,act:'SELESAI'});return;}
    if(r.jejak&&r.now!==r.jejak){
      if(p.umum===r.jejak){out.push({b:r.baris,k,now:r.now,next:p.umum,act:'DIUBAH_LUAR'});alarms.push({j:'DIUBAH_LUAR',b:r.baris,txt:`${k.no}: diubah di luar SKM ("${r.jejak}" → "${r.now}"). Tidak ditimpa, notifikasi ke PIC ${k.pic} & admin.`});return;}
      out.push({b:r.baris,k,now:r.now,next:p.umum,act:'TULIS',why:'Status di SKM berubah, update FF menang'});return;}
    if(r.now===p.umum){out.push({b:r.baris,k,now:r.now,next:p.umum,act:'SAMA'});return;}
    out.push({b:r.baris,k,now:r.now,next:p.umum,act:'TULIS'});
  });
  return {out,alarms,antri};
}

/* ============ Modal & toast ============ */
function modal(title,body,acts){
  const d=document.createElement('div');d.className='scrim';
  d.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${title}</h3>${body}<div class="acts">${acts.map((a,i)=>`<button class="btn ${a.pri?'pri':''}" data-a="${i}">${a.l}</button>`).join('')}</div></div>`;
  document.body.appendChild(d);
  d.addEventListener('click',e=>{if(e.target===d)d.remove();const b=e.target.closest('[data-a]');if(b){const a=acts[+b.dataset.a];if(!a.fn||a.fn(d)!==false)d.remove();}});
  const f=d.querySelector('input,select,textarea');f&&f.focus();
}
let toastT;function toast(m){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200);}
function log(user,aksi,ent,id,field,a,b,cat){LOG.unshift(['15 Nov '+new Date().toTimeString().slice(0,5),user,aksi,ent,id,field,a,b,cat||'']);}
function onClose(k){ /* §10.9: saat kontrak close, notifikasi miliknya yang belum dibaca ditutup otomatis */
  let n=0;NOTIF.forEach(x=>{if(x.k===k.id&&!x.read){x.read='AUTO_CLOSE';n++;}});return n;}

  const np=g('notifPanel');
  if(np){np.onclick=e=>e.stopPropagation();
    g('readAll').onclick=()=>{NOTIF.forEach(n=>{if(!n.read)n.read=true;});render();};

    const q=$('#q');q.oninput=()=>{S.filters.q=q.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);};
    [['fst','st'],['ftahap','tahap'],['fku','ku'],['fpic','pic'],['fpop','pop'],['fseg','seg']].forEach(([id,k])=>$('#'+id).onchange=e=>{S.filters[k]=e.target.value;render();});
    $$('tr[data-k]').forEach(tr=>tr.onclick=e=>{if(e.target.closest('input'))return;location.hash='#kontrak-'+tr.dataset.k;});
    $$('.rowchk').forEach(c=>c.onchange=()=>{c.checked?S.sel.add(c.dataset.id):S.sel.delete(c.dataset.id);render();});
    $('#selAll').onchange=e=>{filtered().forEach(k=>e.target.checked?S.sel.add(k.id):S.sel.delete(k.id));render();};
    $('#exp').onclick=()=>toast(`Export ${filtered().length} kontrak terfilter → Kontrak_2026-11-15.xlsx (dibuat di server)`);
    if($('#bulkGo')){$('#bulkGo').onclick=()=>{const p=$('#bulkPic').value;if(!p){toast('Pilih PIC dulu.');return;}S.sel.forEach(id=>{const k=K.find(x=>x.id===id);log('ompik','ATUR_PIC','Kontrak',id,'PIC',k.pic,p);k.pic=p;});toast(`PIC ${S.sel.size} kontrak diatur ke ${p}. Notifikasi PIC_DITUGASKAN dikirim.`);S.sel.clear();render();};
      $('#bulkClr').onclick=()=>{S.sel.clear();render();};}
  }
  if(r.startsWith('kontrak-K')){const k=K.find(x=>x.id===r.slice(8));if(!k)return;
    $('#picSel').onchange=e=>{log('ompik','ATUR_PIC','Kontrak',k.id,'PIC',k.pic,e.target.value);k.pic=e.target.value;toast('PIC diperbarui.');render();};
    $('#verif')&&($('#verif').onclick=()=>{k.verif=false;toast('Ditandai sudah diverifikasi.');render();});
    $('#arsip').onclick=()=>modal('Arsipkan kontrak?','<div class="muted">Kontrak diarsipkan tidak tampil di daftar dan tidak disinkron. Data tetap tersimpan dan bisa dikembalikan. Hanya admin (izin <span class="mono">kontrak.arsip</span>).</div>',[{l:'Batal'},{l:'Arsipkan',pri:true,fn:()=>toast('(Mockup) Kontrak diarsipkan.')}]);
    $$('.step').forEach(btn=>btn.onclick=()=>moveTahap(k,+btn.dataset.b,btn.dataset.t));
    $('#addBast').onclick=()=>modal('Tambah BAST parsial',`<div class="grid g2"><label class="f">Cakupan order<select class="inp">${k.orders.map(o=>`<option>${o.no}</option>`).join('')||'<option>(belum ada SO/MI)</option>'}</select></label><label class="f">Jumlah lokasi<input class="inp" id="mLok" type="number" value="${k.lok?Math.max(0,k.lok-statusK(k).cak):''}"></label></div><label class="f">Daftar lokasi (opsional)<textarea class="inp" placeholder="Satu lokasi per baris"></textarea></label><label class="f">Keterangan<input class="inp" id="mKet" value="BAST lanjutan"></label><div class="muted" style="font-size:12px">BAST baru dimulai di tahap ${tahLabel(TAHAP.find(t=>t.urut===1).kode)} dengan ID ${k.id}-B${k.bast.length+1}.</div>`,
      [{l:'Batal'},{l:'Tambah',pri:true,fn:d=>{const n=k.bast.length+1;k.bast.push({n,t:'KOMPULIR',s:1,cak:+d.querySelector('#mLok').value||null,order:k.orders[0]?.no||'',hari:0,ket:d.querySelector('#mKet').value,dok:''});if(!k.hist)k.hist=defaultHist(k);k.hist.unshift(['baru saja',`<b>omPik</b> menambah BAST <b>${k.id}-B${n}</b>`]);log('ompik','TAMBAH_BAST','BAST',k.id+'-B'+n,'','','KOMPULIR');toast('BAST ditambahkan. Pratinjau sheet unit diperbarui.');render();}}]);
    $('#addKend').onclick=()=>modal('Buka kendala',`<label class="f">BAST<select class="inp" id="mB">${k.bast.map(b=>`<option value="${b.n}">${k.id}-B${b.n} · ${tahLabel(b.t)}${bastClose(b)?' (CLOSE)':''}</option>`).join('')}</select></label><label class="f">Jenis<select class="inp" id="mJ">${KREF.filter(x=>x.aktif).map(x=>`<option value="${x.kode}">${x.label}${x.reopen?' · memicu reopen':''}</option>`).join('')}</select></label><label class="f">Keterangan (wajib)<textarea class="inp" id="mK"></textarea></label><div class="muted" style="font-size:12px">Bila jenis "memicu reopen" dibuka pada BAST yang sudah close: siklus +1 dan BAST kembali OPEN di tahap ${tahLabel(CONFIG[2][1])}.</div>`,
      [{l:'Batal'},{l:'Buka kendala',pri:true,fn:d=>{const ket=d.querySelector('#mK').value.trim();if(!ket){d.querySelector('#mK').style.borderColor='var(--crit)';toast('Keterangan wajib diisi.');return false;}
        const bn=+d.querySelector('#mB').value,j=d.querySelector('#mJ').value,b=k.bast.find(x=>x.n===bn),ref=KREF.find(x=>x.kode===j);
        k.kend.push({id:'KD-'+String(Math.floor(Math.random()*9000)+1000),b:bn,j,ket,st:'AKTIF',hari:0,oleh:'omPik'});
        if(!k.hist)k.hist=defaultHist(k);k.hist.unshift(['baru saja',`<b>omPik</b> membuka kendala <b>${esc(ref.label)}</b> pada B${bn}`]);
        if(bastClose(b)&&ref.reopen){b.s++;b.t=CONFIG[2][1];b.hari=0;k.hist.unshift(['baru saja',`<b>Reopen</b>: ${k.id}-B${bn} siklus ${b.s}, kembali ke <b>${tahLabel(b.t)}</b>`]);toast(`Reopen: B${bn} kembali OPEN (siklus ${b.s}). Push ke sheet unit berjalan lagi.`);}
        else toast('Kendala dibuka. Kendala Umum di sheet unit ikut berubah.');log('ompik','BUKA_KENDALA','Kendala',k.id,'Status','','AKTIF',ket);render();}}]);
    $$('[data-tutup]').forEach(b=>b.onclick=()=>{const x=k.kend.find(y=>y.id===b.dataset.tutup);x.st='SELESAI';if(!k.hist)k.hist=defaultHist(k);k.hist.unshift(['baru saja',`<b>omPik</b> menyelesaikan kendala <b>${esc(KREF.find(r=>r.kode===x.j).label)}</b>`]);log('ompik','TUTUP_KENDALA','Kendala',x.id,'Status','AKTIF','SELESAI');toast('Kendala selesai.');render();});
  }
  if(base==='antrian'){
    const done=(a,st,cat)=>{a.st=st;a.catatan=cat;render();};
    $$('[data-daftar]').forEach(b=>b.onclick=()=>{const a=ANTRIAN.find(x=>x.id===b.dataset.daftar);modal('Daftarkan kontrak',`<label class="f">No. kontrak<input class="inp mono" value="${esc(a.no)}"></label><div class="grid g2"><label class="f">Pelanggan<input class="inp" value="${esc(a.pel)}"></label><label class="f">Jenis dok<select class="inp"><option>KL</option><option>WO</option><option>SPK</option><option>PO</option></select></label></div><label class="f">Judul<input class="inp" value="${esc(a.judul)}"></label><div class="grid g2"><label class="f">Nilai<input class="inp tnum" value="${a.nilai??''}"></label><label class="f">PIC<select class="inp" id="mP">${PICS.map(p=>`<option>${p}</option>`).join('')}</select></label></div>`,
      [{l:'Batal'},{l:'Daftarkan',pri:true,fn:d=>{const id='K-0000'+(K.length+1);K.push({id,no:a.no,jenis:'KL',tahun:2026,pop:'TREG',pel:a.pel,judul:a.judul,seg:'GOS',nilai:a.nilai,lok:null,pic:d.querySelector('#mP').value,verif:false,sumber:'ANTRIAN',orders:[],bast:[],kend:[]});done(a,'DIDAFTARKAN','→ '+id);toast(`Didaftarkan sebagai ${id}. Di sheet unit akan tampil BELUM DIPROSES.`);}}]);});
    $$('[data-alias]').forEach(b=>b.onclick=()=>{const a=ANTRIAN.find(x=>x.id===b.dataset.alias);modal('Aliaskan ke kontrak yang ada',`<div class="muted">Nomor <span class="mono">${esc(a.no)}</span> akan dikenali sebagai kontrak berikut di semua sinkron berikutnya.</div><label class="f">Kontrak<select class="inp" id="mA">${K.map(k=>`<option value="${k.id}" ${k.id===a.mirip?'selected':''}>${k.id} · ${esc(k.no)}</option>`).join('')}</select></label>`,
      [{l:'Batal'},{l:'Aliaskan',pri:true,fn:d=>{done(a,'DIALIASKAN','→ '+d.querySelector('#mA').value);toast('Alias disimpan.');}}]);});
    $$('[data-abai]').forEach(b=>b.onclick=()=>{const a=ANTRIAN.find(x=>x.id===b.dataset.abai);modal('Abaikan nomor ini?',`<label class="f">Alasan<input class="inp" id="mR" value="${a.no==='TOTAL'?'Baris total, bukan kontrak':''}"></label>`,
      [{l:'Batal'},{l:'Abaikan',pri:true,fn:d=>{done(a,'DIABAIKAN',d.querySelector('#mR').value);}}]);});
  }
  if(base==='gsheet'){
    $$('[data-cek]').forEach(b=>b.onclick=()=>{S.cek[b.dataset.cek]=true;render();toast('Cek saja selesai. Tidak ada yang ditulis.');});
    $$('[data-upd]').forEach(b=>b.onclick=()=>{const t=TARGETS.find(x=>x.id===b.dataset.upd);const res=cekTarget(t);const n=res.out.filter(x=>x.act==='TULIS').length;
      modal('Update ke GSheet?',`<div>Akan menulis <b>${n} baris</b> (KENDALA UMUM + KENDALA DETIL) ke <b>${esc(t.nama)}</b>, tab <span class="mono">${esc(t.tab)}</span>, dalam satu panggilan batch.</div><div class="muted" style="font-size:12px">Kolom kunci dibaca ulang sebelum menulis. Bila urutan baris berubah, update dibatalkan dan dicoba lagi.</div>`,
      [{l:'Batal'},{l:'Update',pri:true,fn:()=>{SHEETROWS[t.id].forEach(r=>{const k=K.find(x=>normKey(x.no)===normKey(r.raw));if(!k||r.formula)return;const res2=cekTarget(t).out.find(o=>o.b===r.baris);if(res2&&res2.act==='TULIS'){r.now=res2.next;r.jejak=res2.next;if(statusK(k).st==='CLOSE')r.closedWritten=true;}});t.upd='15 Nov '+new Date().toTimeString().slice(0,5);t.st='OK';t.pesan=`${n} sel ditulis`;S.cek[t.id]=true;render();toast(`${n} baris ditulis. Tercatat di RiwayatPush & JejakSel.`);}}]);});
    $$('[data-tabbaru]').forEach(b=>b.onclick=()=>{const t=TARGETS.find(x=>x.id===b.dataset.tabbaru);t.tab=t.baru;t.baru=null;t.st='OK';t.pesan='Tab DES 2026 dipakai sejak 15 Nov';NOTIF.forEach(n=>{if(n.j==='TAB_BERGANTI')n.read=true;});render();toast('Tab DES 2026 dipakai. Nilai yang ada dijadikan titik awal.');});
  }
  if(base==='wizard'){
    $('#wnext').onclick=()=>{if(S.wiz===5){S.wiz=1;location.hash='#gsheet';toast('(Mockup) Target diaktifkan.');return;}S.wiz++;render();};
    $('#wprev')&&($('#wprev').onclick=()=>{S.wiz--;render();});
    $$('input[name=wm]').forEach(x=>x.onchange=()=>{S.wizMode=x.value;render();});
  }
  if(base==='pengaturan'){
    const resort=()=>TAHAP.sort((a,b)=>a.urut-b.urut).forEach((t,i)=>t.urut=i+1);
    $$('[data-tup]').forEach(b=>b.onclick=()=>{const t=tah(b.dataset.tup),o=TAHAP.find(x=>x.urut===t.urut-1);[t.urut,o.urut]=[o.urut,t.urut];resort();render();});
    $$('[data-tdn]').forEach(b=>b.onclick=()=>{const t=tah(b.dataset.tdn),o=TAHAP.find(x=>x.urut===t.urut+1);[t.urut,o.urut]=[o.urut,t.urut];resort();render();});
    $$('[data-tact]').forEach(b=>b.onclick=()=>{const t=tah(b.dataset.tact);const n=K.reduce((a,k)=>a+k.bast.filter(x=>x.t===t.kode&&!bastClose(x)).length,0);
      if(t.aktif&&t.penutup){toast('Tahap penutup tidak bisa dinonaktifkan: harus ada tepat satu penutup aktif.');return;}
      if(t.aktif&&n){modal('Tidak bisa menonaktifkan',`<div>Masih ada <b>${n} BAST OPEN</b> di tahap <b>${esc(t.label)}</b>. Pindahkan dulu ke tahap lain.</div><label class="f">Pindahkan semua ke<select class="inp" id="mT">${TAHAP.filter(x=>x.aktif&&x.kode!==t.kode&&!x.penutup).map(x=>`<option value="${x.kode}">${x.label}</option>`).join('')}</select></label>`,
        [{l:'Batal'},{l:'Pindahkan & nonaktifkan',pri:true,fn:d=>{const to=d.querySelector('#mT').value;K.forEach(k=>k.bast.forEach(x=>{if(x.t===t.kode&&!bastClose(x)){x.t=to;x.hari=0;}}));t.aktif=false;render();toast(`${n} BAST dipindah ke ${tahLabel(to)}. Tahap dinonaktifkan; histori tetap aman.`);}}]);return;}
      t.aktif=!t.aktif;render();});
    $('#addTahap')&&($('#addTahap').onclick=()=>modal('Tambah tahap',`<div class="grid g2"><label class="f">Kode (tetap)<input class="inp mono" id="mK" value="VERIF_INTERNAL"></label><label class="f">Label<input class="inp" id="mL" value="Verifikasi Internal"></label></div><label class="f">Sisipkan setelah<select class="inp" id="mP">${TAHAP.filter(t=>!t.penutup).sort((a,b)=>a.urut-b.urut).map(t=>`<option value="${t.urut}" ${t.kode==='DRAFTING'?'selected':''}>${t.label}</option>`).join('')}</select></label>`,
      [{l:'Batal'},{l:'Tambah',pri:true,fn:d=>{const kode=d.querySelector('#mK').value.toUpperCase().replace(/\W/g,'_'),pos=+d.querySelector('#mP').value;if(tah(kode)){toast('Kode sudah dipakai.');return false;}TAHAP.forEach(t=>{if(t.urut>pos)t.urut++;});TAHAP.push({kode,urut:pos+1,label:d.querySelector('#mL').value,penutup:false,batas:14,aktif:true});resort();S.setTab='push';location.hash='#pengaturan-push';render();toast('Tahap ditambahkan. Buat aturan Nilai Push-nya sekarang.');}}]));
    $$('[data-rup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rup;[RULES[i-1],RULES[i]]=[RULES[i],RULES[i-1]];render();});
    $$('[data-rdn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.rdn;[RULES[i+1],RULES[i]]=[RULES[i],RULES[i+1]];render();});
    $$('[data-ract]').forEach(b=>b.onclick=()=>{const r=RULES[+b.dataset.ract];r.aktif=!r.aktif;render();});
    $$('[data-rv]').forEach(inp=>inp.onchange=()=>{RULES[+inp.dataset.rv].v=inp.value.toUpperCase();render();});
    $$('[data-mkrule]').forEach(b=>b.onclick=()=>{const kode=b.dataset.mkrule,t=tah(kode);const idx=RULES.findIndex(r=>r.k.startsWith('TAHAP:')&&tah(r.k.slice(6))&&tah(r.k.slice(6)).urut<t.urut);RULES.splice(idx<0?RULES.length-1:idx,0,{k:'TAHAP:'+kode,v:t.label.toUpperCase(),aktif:true});render();toast('Aturan dibuat. Ubah teksnya bila perlu.');});
    $('#bkNow')&&($('#bkNow').onclick=()=>toast('(Mockup) Salinan DB dibuat di folder Drive SKM_Backup.'));
  }
}
function moveTahap(k,bn,to){
  const b=k.bast.find(x=>x.n===bn); if(b.t===to) return;
  const from=tah(b.t),dest=tah(to),mundur=dest.urut<from.urut;
  const before=evalPush(k).umum,wasClose=statusK(k).st==='CLOSE';
  modal(`${mundur?'Mundurkan':'Majukan'} ${k.id}-B${bn}`,`<div><b>${esc(from.label)}</b> → <b>${esc(dest.label)}</b>${dest.penutup?' <span class="pill p-ok">menutup BAST</span>':''}</div>
   <label class="f">Keterangan${mundur?' (wajib karena mundur)':' (opsional)'}<textarea class="inp" id="mK" placeholder="${mundur?'Alasan mundur…':'Misal: dokumen sudah ditandatangani'}"></textarea></label>
   <div class="muted" style="font-size:12px">Tercatat di RiwayatTahap (masuk/keluar, oleh siapa). Tanggal tiap tahap diambil dari riwayat ini.</div>`,
   [{l:'Batal'},{l:'Simpan',pri:true,fn:d=>{const ket=d.querySelector('#mK').value.trim();if(mundur&&!ket){d.querySelector('#mK').style.borderColor='var(--crit)';toast('Mundur wajib disertai keterangan.');return false;}
     b.t=to;b.hari=0;if(ket)b.ket=ket;if(!k.hist)k.hist=defaultHist(k);k.hist.unshift(['baru saja',`<b>omPik</b> ${mundur?'memundurkan':'memindahkan'} B${bn} ke <b>${esc(dest.label)}</b>${k.pic&&k.pic!=='omPik'?' <span class="pill p-dim">bantu</span>':''}`]);
     log('ompik','UBAH_TAHAP','BAST',k.id+'-B'+bn,'KodeTahap',from.kode,to,ket);
     const after=evalPush(k).umum,nowClose=statusK(k).st==='CLOSE';let msg=before!==after?`Kendala Umum: ${before} → ${after}`:'Tahap disimpan.';
     if(!wasClose&&nowClose){const n=onClose(k);msg='Kontrak CLOSE. '+(n?`${n} notifikasi belum dibaca ditutup otomatis.`:'Tugas FF selesai.');}
     render();toast(msg);}}]);
}

render();
</script>
