<title>Mockup F2 Kontrak</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: "Orbit" — rail kaca di kiri, langit berbintang tipis di belakang, kartu melayang. Alur BAST digambar sebagai lintasan orbit
   (subjek: layanan satelit/VSAT). Detail kontrak = panel geser dari kanan, jadi daftar tetap terlihat. Tema terang + gelap. */
:root{
  --bg:#edf2f5; --surface:#ffffff; --surface2:#f3f7f9; --surface3:#e5edf1; --glass:rgba(255,255,255,.74);
  --line:#d9e3e9; --line2:#c3d1d9; --fg:#0c1a24; --muted:#4d606d; --dim:#7b8d99;
  --accent:#07857b; --accent-hi:#05a394; --on-accent:#ffffff; --accent-bg:rgba(7,133,123,.10); --glow:rgba(7,133,123,.28);
  --violet:#5559e8; --violet-bg:rgba(85,89,232,.10);
  --ok:#14905a; --ok-bg:rgba(20,144,90,.11); --warn:#9c6205; --warn-bg:rgba(214,150,30,.15);
  --crit:#cc3b3b; --crit-bg:rgba(204,59,59,.10); --info:#3a58d6; --info-bg:rgba(58,88,214,.10);
  --fresh:#0ea494; --warm:#c59c00; --stale:#df6f1f; --cold:#d23f3f;
  --halo1:rgba(5,163,148,.16); --halo2:rgba(85,89,232,.11); --star:rgba(12,26,36,.08);
  --shadow:0 1px 2px rgba(12,26,36,.05),0 10px 30px rgba(12,26,36,.06); --shadow-lg:0 30px 80px rgba(12,26,36,.22);
  --scrim:rgba(10,22,32,.32);
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Cascadia Mono",Menlo,monospace;
  --r:18px; --r-sm:11px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060b14; --surface:#0d1522; --surface2:#121d2e; --surface3:#1a283e; --glass:rgba(12,20,33,.72);
  --line:#1b293d; --line2:#2a3c57; --fg:#e4edf6; --muted:#93a6bb; --dim:#617490;
  --accent:#37e2cb; --accent-hi:#86f2e2; --on-accent:#022320; --accent-bg:rgba(55,226,203,.12); --glow:rgba(55,226,203,.42);
  --violet:#9ca2ff; --violet-bg:rgba(156,162,255,.13);
  --ok:#4fd897; --ok-bg:rgba(79,216,151,.12); --warn:#f4c552; --warn-bg:rgba(244,197,82,.12);
  --crit:#ff7c78; --crit-bg:rgba(255,124,120,.12); --info:#92a8ff; --info-bg:rgba(146,168,255,.12);
  --fresh:#37e2cb; --warm:#f4d250; --stale:#ff9e4e; --cold:#ff7c78;
  --halo1:rgba(55,226,203,.10); --halo2:rgba(120,110,255,.12); --star:rgba(220,235,255,.13);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 34px rgba(0,0,0,.38); --shadow-lg:0 30px 90px rgba(0,0,0,.65);
  --scrim:rgba(2,6,12,.58); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#060b14; --surface:#0d1522; --surface2:#121d2e; --surface3:#1a283e; --glass:rgba(12,20,33,.72);
  --line:#1b293d; --line2:#2a3c57; --fg:#e4edf6; --muted:#93a6bb; --dim:#617490;
  --accent:#37e2cb; --accent-hi:#86f2e2; --on-accent:#022320; --accent-bg:rgba(55,226,203,.12); --glow:rgba(55,226,203,.42);
  --violet:#9ca2ff; --violet-bg:rgba(156,162,255,.13);
  --ok:#4fd897; --ok-bg:rgba(79,216,151,.12); --warn:#f4c552; --warn-bg:rgba(244,197,82,.12);
  --crit:#ff7c78; --crit-bg:rgba(255,124,120,.12); --info:#92a8ff; --info-bg:rgba(146,168,255,.12);
  --fresh:#37e2cb; --warm:#f4d250; --stale:#ff9e4e; --cold:#ff7c78;
  --halo1:rgba(55,226,203,.10); --halo2:rgba(120,110,255,.12); --star:rgba(220,235,255,.13);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 34px rgba(0,0,0,.38); --shadow-lg:0 30px 90px rgba(0,0,0,.65);
  --scrim:rgba(2,6,12,.58); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-ligatures:none}
.code,.ku,kbd,.t .no{font-variant-ligatures:none}
.muted{color:var(--muted)} .dim{color:var(--dim)}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
svg.i.s{width:16px;height:16px}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(1100px 620px at 88% -12%,var(--halo1),transparent 62%),radial-gradient(900px 600px at -8% 112%,var(--halo2),transparent 62%)}
.sky::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--star) 1px,transparent 1.4px);background-size:30px 30px;-webkit-mask-image:linear-gradient(to bottom,#000 0,transparent 75%);mask-image:linear-gradient(to bottom,#000 0,transparent 75%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-block:18px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;z-index:25}
.brand{display:flex;gap:11px;align-items:center;padding:2px 8px 22px}
.brand svg{width:40px;height:40px;flex:none}
.brand b{display:block;font-size:14.5px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--muted)}
.orbit-sat{transform-origin:20px 20px;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{display:flex;flex-direction:column;gap:3px;position:relative}
.nav-ind{position:absolute;left:0;right:0;top:0;height:42px;border-radius:13px;background:var(--accent-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent);transition:transform .5s var(--spring);z-index:0}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:13px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;transition:color .2s}
.nav a:hover{color:var(--fg)}
.nav a.on{color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;min-width:22px;text-align:center;background:var(--surface3);color:var(--fg);border-radius:999px;padding:1px 7px}
.nav a.on .cnt{background:var(--accent);color:var(--on-accent)}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.live{display:inline-flex;align-items:center;gap:8px;color:var(--fg);font-weight:600}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);position:relative;flex:none}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ok);opacity:0;animation:ping 2.2s var(--ease) infinite}
.pulse.warn{background:var(--warn)} .pulse.warn::after{border-color:var(--warn)}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance;line-height:1.2}
.top .crumb{color:var(--muted);font-size:12.5px}
.top .sp{flex:1}
.cmdk{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 14px;color:var(--muted);cursor:pointer;min-width:250px;box-shadow:var(--shadow);transition:border-color .2s}
.cmdk:hover{border-color:var(--accent)}
.cmdk span{flex:1;text-align:left}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;padding:0 6px;color:var(--muted);background:var(--surface2)}
.mock{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--warn);color:var(--warn);padding:3px 8px;border-radius:7px;white-space:nowrap;font-weight:700}
.iconbtn{background:none;border:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer;position:relative;transition:background .2s,color .2s}
.iconbtn:hover{background:var(--surface3);color:var(--fg)}
.iconbtn[disabled]{opacity:.35;cursor:default}
.badge{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg)}
.me{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);cursor:pointer;font-weight:600;font-size:13px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--violet));flex:none}
.av.sm{width:26px;height:26px;font-size:11px}
.av.none{background:var(--warn-bg);color:var(--warn)}
.burger{display:none}
.content{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;min-width:0;max-width:1480px;width:100%}
.content.enter>*{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* ---------- building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
.card h2 small{font-weight:500;color:var(--muted);font-size:12.5px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g64{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.03em;line-height:1.05}
.kpi .s{font-size:12px;color:var(--dim);margin-top:4px}
.kpi .glyph{position:absolute;right:-8px;top:-8px;width:64px;height:64px;opacity:.07;fill:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 16px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px -6px var(--glow)}
.btn.pri:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.ton{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-bg)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.inp,select.inp,textarea.inp{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 11px;min-width:0;transition:border-color .2s,box-shadow .2s}
textarea.inp{width:100%;min-height:76px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-bg)}
.of{position:relative;display:flex;flex-direction:column;min-width:0}
.of>span{position:absolute;top:-8px;left:10px;padding:0 5px;font-size:11px;font-weight:600;color:var(--accent);background:var(--surface);line-height:16px;z-index:1}
.of>.inp{padding:12px 12px 10px;width:100%}
.of>small{font-size:11.5px;color:var(--dim);margin-top:4px;padding-left:4px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;flex:1 1 260px;min-width:0;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.search input{background:none;border:0;outline:0;flex:1;min-width:0}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px;transition:background .25s,color .25s}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chipf{border:1px dashed var(--line2);background:transparent;border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:all .2s}
.chipf.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.chipf b{font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface3);color:var(--fg)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-crit{background:var(--crit-bg);color:var(--crit)} .p-info{background:var(--info-bg);color:var(--info)}
.p-acc{background:var(--accent-bg);color:var(--accent)} .p-dim{background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-vio{background:var(--violet-bg);color:var(--violet)}
.ku{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.02em;border-radius:7px;padding:3px 8px;white-space:nowrap;display:inline-block}

.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.t th{text-align:left;font-weight:600;color:var(--dim);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer;transition:background .15s}
.t tbody tr.click:hover td{background:var(--surface2)}
.t tbody tr.sel td{background:var(--accent-bg)}
.t td.num,.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.t .no{font-family:var(--mono);font-size:12px;font-weight:500}
.t .sub{display:block;font-size:12px;color:var(--muted);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.agebar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface3);min-width:120px;gap:2px}
.agebar i{display:block;height:100%;border-radius:3px}
.age{font-size:11.5px;border-radius:7px;padding:2px 8px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.a-fresh{background:color-mix(in srgb,var(--fresh) 15%,transparent);color:var(--fresh)} .a-warm{background:color-mix(in srgb,var(--warm) 16%,transparent);color:var(--warm)}
.a-stale{background:color-mix(in srgb,var(--stale) 15%,transparent);color:var(--stale)} .a-cold{background:color-mix(in srgb,var(--cold) 15%,transparent);color:var(--cold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:22px}
.spark i{width:5px;border-radius:2px;background:var(--accent);opacity:.75}
.spark i:last-child{opacity:1;box-shadow:0 0 8px var(--glow)}

.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) 30px;gap:12px;align-items:center;font-size:13px;cursor:pointer;border-radius:8px}
.hb:hover .lbl{color:var(--accent)}
.hb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
.hb .track{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.hb .fill{height:100%;border-radius:6px;transform-origin:left}
.enter .hb .fill{animation:grow 1s var(--ease) both;animation-delay:.25s}
@keyframes grow{from{transform:scaleX(0)}}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}

.hero{position:relative;overflow:hidden;padding:20px 22px 14px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 50% 120%,var(--halo1),transparent 70%);pointer-events:none}
.pipe-wrap{overflow-x:auto;margin:0 -8px}
.pipe{display:block;width:100%;min-width:760px;height:auto}
.pipe .track{fill:none;stroke:var(--line2);stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round}
.pipe .trail{fill:none;stroke:url(#gTrail);stroke-width:3;stroke-linecap:round}
.pipe .pt{fill:var(--accent);filter:drop-shadow(0 0 4px var(--glow))}
.pnode{cursor:pointer;outline:none}
.pnode .body{fill:var(--surface);stroke:var(--accent);stroke-width:2;transition:stroke-width .2s}
.pnode:hover .body,.pnode:focus-visible .body{stroke-width:4}
.pnode .halo{fill:var(--accent);opacity:.10}
.pnode.closer .body{stroke:var(--ok)} .pnode.closer .halo{fill:var(--ok)}
.pnode .ring{fill:none;stroke:var(--warn);stroke-width:2;stroke-dasharray:4 5;transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite}
.pnode .cnt{fill:var(--fg);font-weight:800;font-size:22px;font-family:var(--font)}
.pnode .lbl{fill:var(--fg);font-size:12.5px;font-weight:600;font-family:var(--font)}
.pnode .sub{fill:var(--muted);font-size:11.5px;font-family:var(--font)}
.pnode .sub.w{fill:var(--warn);font-weight:700}
.enter .pnode{animation:popin .6s var(--spring) both;animation-delay:calc(.15s + var(--d)*70ms);transform-box:fill-box;transform-origin:center}
@keyframes popin{from{opacity:0;transform:scale(.6)}}

.syncs{display:grid;gap:10px}
.sync{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}

/* drawer */
.dscrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:40;animation:fade .35s var(--ease) both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1080px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slidein .5s var(--ease) both;padding-top:env(safe-area-inset-top,0px)}
.drawer::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(700px 300px at 100% 0,var(--halo1),transparent 70%)}
.closing .drawer{animation:slideout .3s ease-in both}
.closing .dscrim{animation:fadeout .3s ease-in both}
@keyframes slidein{from{transform:translateX(70px);opacity:0}}
@keyframes slideout{to{transform:translateX(70px);opacity:0}}
@keyframes fade{from{opacity:0}} @keyframes fadeout{to{opacity:0}}
.dhead{padding-block:14px 0;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.dtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dtitle{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dtitle .no{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.dtitle h2{margin:4px 0 2px;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.dtabs{display:flex;gap:4px;position:relative;overflow-x:auto}
.dtabs button{background:none;border:0;padding:10px 16px;cursor:pointer;font-weight:700;color:var(--muted);font-size:13.5px;position:relative;white-space:nowrap}
.dtabs button.on{color:var(--fg)}
.dtabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);box-shadow:0 0 12px var(--glow)}
.dbody{flex:1;overflow:auto;padding-block:20px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.dbody.swap>*{animation:rise .4s var(--ease) both}

.bast{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px;display:flex;flex-direction:column;gap:16px;background:var(--surface);box-shadow:var(--shadow)}
.bast-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bast-h b{font-family:var(--mono);font-size:13px}
.otrack{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(78px,1fr);overflow-x:auto;padding:6px 0 2px}
.otrack .rail,.otrack .prog{position:absolute;top:19px;height:3px;border-radius:3px}
.otrack .rail{left:var(--half);right:var(--half);background:var(--surface3)}
.otrack .prog{left:var(--half);background:linear-gradient(90deg,var(--accent),var(--violet));box-shadow:0 0 12px var(--glow);transition:width .8s var(--ease)}
.ost{position:relative;z-index:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 4px;color:var(--muted);font-size:11.5px;font-weight:600;line-height:1.25;text-align:center}
.ost .d{width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--line2);display:grid;place-items:center;font-size:11px;font-weight:800;transition:all .3s var(--spring)}
.ost:hover .d{border-color:var(--accent);transform:scale(1.12)}
.ost:hover{color:var(--fg)}
.ost.done .d{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ost.done{color:var(--fg)}
.ost.cur .d{width:34px;height:34px;margin-top:-3px;margin-bottom:-3px;background:var(--surface);border:3px solid var(--accent);color:var(--accent);box-shadow:0 0 0 6px var(--accent-bg),0 0 22px var(--glow)}
.ost.cur{color:var(--accent);font-weight:800}
.ost.closer.done .d,.ost.closer.cur .d{background:var(--ok);border-color:var(--ok);color:var(--on-accent);box-shadow:0 0 0 6px var(--ok-bg)}
.ost.closer.cur{color:var(--ok)}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.push{display:flex;flex-direction:column;gap:2px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pushrow{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;align-items:baseline;font-size:13px;padding:10px 12px;background:var(--surface2)}
.pushrow .k{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-weight:600}
.pushrow .v{font-family:var(--mono);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.pushrow.main .v{color:var(--accent);font-size:13.5px}
.sheetprev{border-radius:14px;overflow:hidden;border:1px solid var(--line);font-size:12px;background:var(--surface)}
.sheetprev .sh{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--surface3);font-weight:600;color:var(--muted)}
.sheetprev .sh i{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block}
.tl{display:flex;flex-direction:column;font-size:13px;position:relative}
.tl .e{display:grid;grid-template-columns:18px 96px minmax(0,1fr);gap:10px;padding:9px 0;align-items:start}
.tl .e .b{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:5px;box-shadow:0 0 0 4px var(--accent-bg)}
.tl .w{color:var(--dim);font-size:12px}
.kend{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--crit-bg);border:1px solid color-mix(in srgb,var(--crit) 25%,transparent)}
.kend.done{background:var(--surface2);border-color:var(--line);opacity:.75}
.note{padding:11px 14px;border-radius:14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.info{background:var(--info-bg);color:var(--info)}
.note.ok{background:var(--ok-bg);color:var(--ok)} .note.crit{background:var(--crit-bg);color:var(--crit)}
.note .tx{color:var(--fg)} .note b{color:inherit}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:10px 16px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:700;position:relative;transition:color .2s}
.tabs a:hover{color:var(--fg)}
.tabs a.on{color:var(--fg)}
.tabs a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);box-shadow:0 0 12px var(--glow)}
.bulk{position:sticky;bottom:16px;background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:8px 10px 8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow-lg),0 0 0 4px var(--accent-bg);animation:rise .35s var(--spring) both}
.wiz-steps{display:flex;gap:6px;flex-wrap:wrap}
.wiz-steps span{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:12.5px;font-weight:600;border:1px solid var(--line)}
.wiz-steps span i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface3);font-style:normal;font-size:11.5px;font-weight:800}
.wiz-steps span.on{color:var(--accent);background:var(--accent-bg);border-color:transparent}
.wiz-steps span.on i{background:var(--accent);color:var(--on-accent)}
.wiz-steps span.done i{background:var(--ok);color:var(--on-accent)}
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice label{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1.5px solid var(--line2);cursor:pointer;transition:all .2s;background:var(--surface)}
.choice label.on{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 4px var(--accent-bg)}
.choice input{accent-color:var(--accent);margin-top:3px}
.choice b{display:block;margin-bottom:2px}
.chk{width:16px;height:16px;accent-color:var(--accent)}
.toggle{width:38px;height:22px;border-radius:11px;background:var(--surface3);border:1px solid var(--line2);position:relative;cursor:pointer;flex:none;transition:background .25s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:left .3s var(--spring),background .25s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on::after{left:18px;background:var(--on-accent)}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}
.attn{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);cursor:pointer;transition:transform .2s var(--ease),border-color .2s;align-items:center}
.attn:hover{transform:translateX(3px);border-color:var(--accent)}
.attn .bar{width:4px;border-radius:4px;flex:none;align-self:stretch}
.qcard{display:flex;flex-direction:column;gap:12px}
.diff-old{text-decoration:line-through;color:var(--dim)}
.diff-new{color:var(--accent);font-weight:700}
.code{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre;overflow-x:auto;max-height:180px;color:var(--muted)}

/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .25s var(--ease) both}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px;width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-lg);animation:pop .45s var(--spring) both}
.scrim.closing{animation:fadeout .2s ease-in both} .scrim.closing .modal{animation:popout .2s ease-in both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}}
@keyframes popout{to{opacity:0;transform:translateY(6px) scale(.97)}}
.modal h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pal{place-items:start center;padding-top:12vh}
.pal .modal{padding:0;gap:0;width:min(640px,100%)}
.pal .ps{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pal .ps input{flex:1;background:none;border:0;outline:0;font-size:16px;min-width:0}
.pal .pr{max-height:50vh;overflow:auto;padding:8px}
.pal .pi{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer}
.pal .pi.on{background:var(--accent-bg)}
.pal .pi .mono{font-size:11.5px;color:var(--muted)}
.pal .pf{display:flex;gap:14px;padding:10px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.notif{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:62px;width:min(420px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;transform-origin:top right;transition:opacity .25s var(--ease),transform .35s var(--spring),visibility .35s;opacity:0;transform:scale(.94) translateY(-6px);pointer-events:none;visibility:hidden}
.notif.open{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.notif-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.notif-i{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;transition:background .15s}
.notif-i:hover{background:var(--surface2)}
.notif-i.read{opacity:.5}
.notif-i .w{font-size:11.5px;color:var(--dim);margin-top:3px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;z-index:70;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);display:flex;gap:10px;align-items:center;animation:toastin .45s var(--spring) both;transform:translateX(-50%)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.login-art{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:40px;padding-left:max(40px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:radial-gradient(700px 500px at 40% 45%,var(--halo1),transparent 70%),radial-gradient(500px 400px at 80% 90%,var(--halo2),transparent 70%)}
.login-art svg.orb{position:absolute;left:50%;top:50%;width:min(620px,95%);transform:translate(-50%,-50%);overflow:visible}
.orb .ring{fill:none;stroke:var(--line2);stroke-width:1.2}
.orb .ring.d{stroke-dasharray:3 8}
.orb .nd{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.orb .nd.ok{stroke:var(--ok)}
.orb text{fill:var(--muted);font-size:12px;font-weight:600;font-family:var(--font)}
.orb .sat{fill:var(--accent);filter:drop-shadow(0 0 6px var(--glow))}
.login-art h2{position:relative;font-size:clamp(26px,3.2vw,40px);line-height:1.1;letter-spacing:-.03em;margin:0;font-weight:800;max-width:15ch;text-wrap:balance}
.login-art h2 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.login-form{display:grid;place-items:center;padding-block:32px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-form .box{width:min(380px,100%);display:flex;flex-direction:column;gap:18px}
.login-form h3{font-size:24px;margin:0;font-weight:800;letter-spacing:-.02em}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g64,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:264px;transform:translateX(-105%);transition:transform .35s var(--ease);background:var(--surface)}
  .side.open{transform:none;box-shadow:var(--shadow-lg)}
  .burger{display:grid}
  .g2,.choice{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:4px}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .crumb,.me .nm,.mock,.cmdk span,.cmdk kbd{display:none}
  .top h1{font-size:17px}
  .cmdk{min-width:0;padding:9px;border-radius:50%}
  .hb{grid-template-columns:minmax(0,120px) minmax(0,1fr) 26px}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-art{min-height:320px;border-right:0;border-bottom:1px solid var(--line);padding:24px}
  .dtitle h2{font-size:20px}
  .dhead,.dbody{padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
  .dkeys{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.pipe .pt,.orb .sat{display:none}}
/* ---- tambahan F1 ---- */
/* Tambahan khusus mockup F1 */
.mpanel{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;background:var(--surface);border:1px dashed var(--warn);border-radius:16px;box-shadow:var(--shadow-lg);width:min(300px,calc(100vw - 32px));font-size:12.5px;overflow:hidden}
.mpanel summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:800;color:var(--warn);display:flex;align-items:center;gap:8px;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
.mpanel summary::-webkit-details-marker{display:none}
.mpanel .mb{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.mpanel .mb .lbl{font-weight:700;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.mpanel .chips{display:flex;flex-wrap:wrap;gap:6px}
.mpanel .chips button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line2);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer}
.mpanel .chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.term{font-family:var(--mono);font-variant-ligatures:none;font-size:12.5px;line-height:1.75;background:#0b1220;color:#cfe3f0;border-radius:14px;padding:16px 18px;overflow-x:auto;white-space:pre}
.term .t{color:#6f8aa3} .term .ok{color:#5fe0a0} .term .k{color:#ffd479;font-weight:700} .term .c{color:#8fb3ff}
.nav a.soon{opacity:.45;cursor:not-allowed}
.nav a.soon .cnt{background:transparent;border:1px solid var(--line2);color:var(--muted);font-weight:600}
.rules{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.rules span{display:flex;gap:8px;align-items:center;color:var(--muted)}
.rules span.ok{color:var(--ok)}
.rules i{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800}
.secret{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--surface2);border:1px dashed var(--accent);font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.08em;font-variant-ligatures:none}
.secret .btn{font-family:var(--font);letter-spacing:0;font-size:12.5px}
.denied{display:grid;place-items:center;text-align:center;padding:60px 20px;gap:10px}
.denied .big{width:64px;height:64px;border-radius:20px;background:var(--crit-bg);color:var(--crit);display:grid;place-items:center}
.denied .big svg{width:32px;height:32px}
.res-ok{color:var(--ok);font-weight:700} .res-no{color:var(--crit);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.check:last-child{border-bottom:0}
.check .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.check .d.y{background:var(--ok);color:var(--on-accent)} .check .d.n{background:var(--surface3);color:var(--muted)}
/* Users: avatar status, menu ⋮, panel user */
.ava{--s:34px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(var(--s)*.36);color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--violet));box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ring,transparent);flex:none;letter-spacing:.02em}
.ava.on{--ring:var(--ok)} .ava.pw{--ring:var(--warn)} .ava.lock{--ring:var(--crit)} .ava.off{--ring:var(--line2);filter:grayscale(1);opacity:.55}
.rbadge{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;padding:3px 10px 3px 7px;border-radius:999px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line)}
.rbadge svg{width:15px;height:15px;fill:currentColor}
.rbadge.ADMIN{background:var(--accent-bg);color:var(--accent);box-shadow:none} .rbadge.VIEWER{color:var(--muted)}
.menu{position:fixed;z-index:65;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;width:250px;animation:pop .25s var(--spring) both}
.menu button{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:none;padding:9px 12px;border-radius:10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg);text-align:left}
.menu button:hover:not([disabled]){background:var(--surface2)} .menu button.danger{color:var(--crit)} .menu button[disabled]{opacity:.5;cursor:not-allowed}
.menu button svg{width:18px;height:18px;fill:currentColor;flex:none;margin-top:1px}
.menu small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.idcard{position:relative;overflow:hidden;border-radius:20px;padding:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 15%,var(--surface)),color-mix(in srgb,var(--violet) 13%,var(--surface)));border:1px solid var(--line);display:flex;gap:16px;align-items:center;min-height:118px}
.idcard::before,.idcard::after{content:"";position:absolute;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--accent) 35%,transparent);pointer-events:none}
.idcard::before{width:240px;height:240px;right:-90px;top:-110px} .idcard::after{width:150px;height:150px;right:-30px;top:-55px;border-style:solid;border-color:color-mix(in srgb,var(--violet) 25%,transparent)}
.idcard .who{min-width:0;position:relative;z-index:1}
.idcard .who b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}

/* ================= Logika domain (Domain.gs: fungsi murni + unit test) ================= */
const tah=k=>TAHAP.find(t=>t.kode===k);
const tahLabel=k=>tah(k)?.label??k;
const closer=()=>TAHAP.find(t=>t.penutup&&t.aktif);
const bastClose=b=>!!tah(b.t)?.penutup;
const activeKend=k=>k.kend.filter(x=>x.st==='AKTIF');
function statusK(k){
  if(!k.bast.length) return {st:'OPEN',belum:true,sisa:false,cak:0};   // CLOSE butuh minimal 1 BAST
  const all=k.bast.every(bastClose),cak=k.bast.reduce((a,b)=>a+(b.cak||0),0);
  if(all&&(!k.lok||cak>=k.lok)) return {st:'CLOSE',sisa:false,cak};
  return {st:'OPEN',sisa:all,cak};
}
function bottleneck(k){return k.bast.filter(b=>!bastClose(b)).sort((a,b)=>tah(a.t).urut-tah(b.t).urut)[0];}
function tahapK(k){const b=bottleneck(k);if(b)return b.t;return k.bast.length?closer().kode:null;}
function evalPush(k){
  const s=statusK(k),tk=tahapK(k),ak=activeKend(k);
  for(let i=0;i<RULES.length;i++){const r=RULES[i];if(!r.aktif)continue;let hit=null;
    if(r.k==='CLOSE'&&s.st==='CLOSE')hit='t';
    else if(r.k==='SISA_LOKASI'&&s.sisa)hit='t';
    else if(r.k==='BELUM_ADA_BAST'&&s.belum)hit='t';
    else if(r.k.startsWith('TAHAP:')&&s.st!=='CLOSE'&&!s.sisa&&tk===r.k.slice(6))hit='t';
    else if(r.k.startsWith('KENDALA:')){const c=r.k.slice(8);const m=ak.find(x=>c==='*'||x.j===c);if(m)hit=m;}
    if(hit){let detil;
      if(hit==='t'){const lb=k.bast[k.bast.length-1];detil=lb?lb.ket:'';if(ak.length)detil+=` (+${ak.length})`;}
      else{detil=hit.ket;if(ak.length>1)detil+=` (+${ak.length-1})`;}
      return {i,r,umum:r.v,detil};}}
  return {i:-1,r:null,umum:null,detil:null};
}
const bucket=h=>h<=AGING[0]?'fresh':h<=AGING[1]?'warm':h<=AGING[2]?'stale':'cold';
const agingK=k=>{const b=bottleneck(k);if(b)return b.hari;if(statusK(k).sisa)return k.bast[k.bast.length-1].hari;return null;};
function parsialTxt(k){if(k.bast.length<2&&!k.lok)return '—';const c=k.bast.filter(bastClose).length;return `${c}/${k.bast.length} BAST`+(k.lok?` · ${statusK(k).cak}/${k.lok} lokasi`:'');}
const normKey=s=>String(s??'').normalize('NFKC').toUpperCase().replace(/[‐-―−]/g,'-').replace(/\s+/g,'').replace(/\.+$/,'');
const normName=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(w=>w&&!['PT','TBK','PERSERO','CV'].includes(w)).join('');
const jenisCust=k=>(!k.pel||!k.end)?'BELUM':normName(k.end)===normName(k.pel)?'DIRECT':'INDIRECT';   // customer vs end customer; salah satu kosong = belum terdefinisi
const JC_LABEL={DIRECT:'DIRECT',INDIRECT:'INDIRECT',BELUM:'BELUM TERDEFINISI'};
const custName=k=>k.end||k.pel||'(nama belum diisi)';   // tampilkan end customer

function kuClass(p){if(!p||!p.r)return 'p-crit';const k=p.r.k;return k==='CLOSE'?'p-ok':k.startsWith('KENDALA')?'p-crit':k==='SISA_LOKASI'?'p-warn':k==='BELUM_ADA_BAST'?'p-dim':'p-info';}
function kuChip(p){return `<span class="ku ${kuClass(p)}">${esc(p&&p.umum?p.umum:'TANPA ATURAN')}</span>`;}
function statusPill(k){const s=statusK(k);if(s.st==='CLOSE')return '<span class="pill p-ok"><span class="dot"></span>CLOSE</span>';if(s.sisa)return '<span class="pill p-warn"><span class="dot"></span>Menunggu BAST lanjutan</span>';return '<span class="pill p-dim">OPEN</span>';}

function smooth(p){let d=`M${p[0].x},${p[0].y}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;

    const k=K.find(x=>normKey(x.no)===nk);if(!k){antri.push({b:r.baris,no:r.raw});return;}
    const p=evalPush(k),s=statusK(k);

/* ================= Command palette (Ctrl K) ================= */
function openPalette(){
  if(document.querySelector('.pal'))return;
  const d=document.createElement('div');d.className='scrim pal';let idx=0,items=[];
  d.innerHTML=`<div class="modal" role="dialog" aria-label="Cari"><div class="ps">${ic('search')}<input id="palq" placeholder="Ketik nomor kontrak, pelanggan, atau halaman…" autocomplete="off" aria-label="Cari"><kbd>Esc</kbd></div><div class="pr" id="palr"></div><div class="pf"><span><kbd>↑</kbd> <kbd>↓</kbd> pilih</span><span><kbd>Enter</kbd> buka</span></div></div>`;
  document.getElementById('overlay-root').appendChild(d);const q=d.querySelector('#palq'),r=d.querySelector('#palr');
  const close=()=>{d.classList.add('closing');setTimeout(()=>d.remove(),200);};d._close=close;
  const pick=()=>{const it=items[idx];if(!it)return;close();if(it.type==='k')openDrawer(it.id);else location.hash='#'+it.id;};
  const draw=()=>{const s=q.value.toLowerCase().trim();
    const ks=K.filter(k=>!s||(k.no+' '+k.pel+' '+k.end+' '+k.judul+' '+k.id).toLowerCase().includes(s)).slice(0,7).map(k=>({type:'k',id:k.id,k}));
    const pages=NAV.filter(n=>!s||n[1].toLowerCase().includes(s)).slice(0,s?4:3).map(n=>({type:'page',id:n[0],t:n[1],ic:n[2]}));
    items=[...ks,...pages];idx=Math.max(0,Math.min(idx,items.length-1));
    r.innerHTML=items.map((it,i)=>it.type==='k'?`<div class="pi ${i===idx?'on':''}" data-i="${i}">${avatar(it.k.pic,1)}<div style="min-width:0;flex:1"><div style="font-weight:700">${esc(custName(it.k))}</div><div class="mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.k.no)}</div></div>${kuChip(evalPush(it.k))}</div>`:`<div class="pi ${i===idx?'on':''}" data-i="${i}">${ic(it.ic)}<span style="flex:1">Buka ${esc(it.t)}</span><span class="dim" style="font-size:12px">halaman</span></div>`).join('')||'<div class="pi muted">Tidak ditemukan.</div>';
    r.querySelectorAll('[data-i]').forEach(el=>{el.onmouseenter=()=>{idx=+el.dataset.i;r.querySelectorAll('.pi').forEach((x,j)=>x.classList.toggle('on',j===idx));};el.onclick=pick;});};
  q.oninput=()=>{idx=0;draw();};
  q.onkeydown=e=>{if(e.key==='ArrowDown'){idx=Math.min(items.length-1,idx+1);draw();e.preventDefault();}else if(e.key==='ArrowUp'){idx=Math.max(0,idx-1);draw();e.preventDefault();}else if(e.key==='Enter')pick();};
  d.addEventListener('click',e=>{if(e.target===d)close();});
  draw();setTimeout(()=>q.focus(),30);
}

/* ================= Modal & toast ================= */
function modal(title,body,acts){
  const d=document.createElement('div');d.className='scrim';
  d.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${title}</h3>${body}<div class="acts">${acts.map((a,i)=>`<button class="btn ${a.pri?'pri':''}" data-a="${i}">${a.l}</button>`).join('')}</div></div>`;
  document.getElementById('overlay-root').appendChild(d);
  const close=()=>{d.classList.add('closing');setTimeout(()=>d.remove(),200);};d._close=close;
  d.addEventListener('click',e=>{if(e.target===d){close();return;}const b=e.target.closest('[data-a]');if(b){const a=acts[+b.dataset.a];if(!a.fn||a.fn(d)!==false)close();}});
  setTimeout(()=>d.querySelector('textarea,input,select')?.focus(),60);
}

});

     ${F.orders.map((o,i)=>`<div class="orow"><select class="inp" data-o="${i}" data-f="j">${opt(['SO','MI'],o.j)}</select><input class="inp mono" data-o="${i}" data-f="no" value="${esc(o.no)}" placeholder="No. SO/MI" aria-label="No order ${i+1}"><input class="inp" data-o="${i}" data-f="lay" value="${esc(o.lay)}" placeholder="Layanan" aria-label="Layanan ${i+1}"><input class="inp" data-o="${i}" data-f="pek" value="${esc(o.pek)}" placeholder="Pekerjaan" aria-label="Pekerjaan ${i+1}"><input class="inp tnum" data-o="${i}" data-f="lok" value="${esc(o.lok)}" placeholder="Lokasi" aria-label="Lokasi ${i+1}"><button type="button" class="iconbtn" data-odel="${i}" aria-label="Hapus baris">${ic('trash','s')}</button></div>`).join('')}
     <button type="button" class="btn sm ton" id="oadd" style="align-self:flex-start">${ic('add','s')}Tambah SO/MI</button></div>
    <div class="sect"><div class="eyebrow">BAST awal</div>
     <div class="swrow"><div style="flex:1"><b>Buat BAST-1 sekarang</b><small>Tanpa BAST, di sheet unit tampil "BELUM DIPROSES"</small></div><button type="button" class="toggle ${F.buatBast?'on':''}" id="kbast" aria-label="Buat BAST-1" aria-pressed="${F.buatBast}"></button></div>
     ${F.buatBast?`<label class="of" style="max-width:280px"><span>Dokumen tagih</span><select class="inp" id="kdoc">${DOKTAGIH.map(d=>`<option value="${d.kode}" ${d.kode===(F.doc||({DIRECT:'BAA',INDIRECT:'BAST',BELUM:'BAST'})[jcOf(F)])?'selected':''}>${d.label}</option>`).join('')}</select><small>Mulai di tahap ${esc(tahLabel(TAHAP.slice().sort((a,b)=>a.urut-b.urut)[0].kode))}</small></label>`:''}</div>`:''}
    <div id="kerr">${S.kfErr?`<div class="note crit">${ic('warn','s')}<span class="tx">${S.kfErr}</span></div>`:''}</div>
   </div>
   <div class="sfoot"><button class="btn" id="kcancel">Batal</button><button class="btn pri" id="ksave">${ic('check','s')}${isNew?'Daftarkan kontrak':'Simpan'}</button></div>
  </aside></div>`;
  root.querySelector('.dbody').scrollTop=sc;bindKForm();
}
function bindKForm(){
  const q=s=>document.querySelector('#sheet-root '+s),F=S.kf;
  q('#kclose').onclick=q('#kcancel').onclick=q('#kscrim').onclick=()=>closeKForm();
  q('#kno').oninput=e=>{F.no=e.target.value;q('#kdupe').innerHTML=dupeHtml();bindDupe();};
  const bindDupe=()=>document.querySelectorAll('#sheet-root [data-opendupe]').forEach(b=>b.onclick=()=>{closeKForm(true);openDrawer(b.dataset.opendupe);});bindDupe();
  ['pel','end'].forEach(f=>q('#k'+f).oninput=e=>{F[f]=e.target.value;q('#kjc').innerHTML=jcHtml();if(q('#kdoc')&&!F.doc){q('#kdoc').value=({DIRECT:'BAA',INDIRECT:'BAST',BELUM:'BAST'})[jcOf(F)];}});
  q('#knilai').oninput=e=>{F.nilai=e.target.value;q('#krp').innerHTML=rpHtml();};
  [['jenis','change'],['tahun','input'],['judul','input'],['pop','change'],['seg','change'],['lok','input'],['pic','change']].forEach(([f,ev])=>{const el=q('#k'+f);if(el)el.addEventListener(ev,e=>{F[f]=e.target.value;});});
  document.querySelectorAll('#sheet-root [data-o]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{F.orders[+el.dataset.o][el.dataset.f]=el.value;}));
  document.querySelectorAll('#sheet-root [data-odel]').forEach(b=>b.onclick=()=>{F.orders.splice(+b.dataset.odel,1);renderKForm(false);});
  if(q('#oadd'))q('#oadd').onclick=()=>{F.orders.push({j:'SO',no:'',lay:'',pek:'',lok:''});renderKForm(false);};
  if(q('#kbast'))q('#kbast').onclick=()=>{F.buatBast=!F.buatBast;renderKForm(false);};
  if(q('#kdoc'))q('#kdoc').onchange=e=>{F.doc=e.target.value;};
  q('#ksave').onclick=saveKontrak;
}
function saveKontrak(){
  const F=S.kf,O=S.kfOrig,isNew=!O,err=m=>{S.kfErr=m;renderKForm(false);document.querySelector('#sheet-root .dbody').scrollTop=1e5;};
  F.no=F.no.trim();F.judul=String(F.judul).trim();
  if(!F.no)return err('No. kontrak wajib diisi.');
  const d=dupeOf(F);if(d)return err(`No. kontrak sudah terdaftar sebagai <b>${d.id}</b>. Buka kontrak itu, atau aliaskan bila penulisannya berbeda.`);
  if(!F.judul)return err('Judul kontrak wajib diisi.');
  const nilai=String(F.nilai).replace(/[^\d]/g,'');if(F.nilai!==''&&!nilai)return err('Nilai kontrak harus angka.');
  if(F.lok!==''&&!(Number(F.lok)>=1&&Number.isInteger(Number(F.lok))))return err('Jumlah lokasi harus bilangan bulat ≥ 1, atau kosongkan.');
  if(!(Number(F.tahun)>=2000&&Number(F.tahun)<=2100))return err('Tahun project tidak valid.');
  const orders=isNew?F.orders.filter(o=>o.no.trim()).map(o=>({j:o.j,no:o.no.trim(),lay:o.lay,pek:o.pek,lok:Number(o.lok)||0})):null;
  if(isNew&&new Set(orders.map(o=>normKey(o.no))).size!==orders.length)return err('Ada nomor SO/MI yang dobel.');
  const data={no:F.no,jenis:F.jenis,tahun:Number(F.tahun),pop:F.pop,pel:F.pel.trim(),end:F.end.trim(),judul:F.judul,seg:F.seg,nilai:nilai===''?null:Number(nilai),lok:F.lok===''?null:Number(F.lok),pic:F.pic};
  if(isNew){
    const id='K-'+String(K.length+1).padStart(6,'0'),first=TAHAP.slice().sort((a,b)=>a.urut-b.urut)[0].kode;
    const doc=F.doc||({DIRECT:'BAA',INDIRECT:'BAST',BELUM:'BAST'})[jenisCust(data)];
    K.push({id,...data,verif:false,sumber:'MANUAL',alias:[],orders,kend:[],
      bast:F.buatBast?[{n:1,doc,t:first,s:1,cak:null,order:orders.map(o=>o.no).join(', '),hari:0,ket:'Dibuat bersama kontrak',dok:''}]:[],
      hist:[[nowTxt(),`<b>${esc(meName())}</b> mendaftarkan kontrak (input manual)${F.buatBast?' dan membuat BAST-1 ('+doc+')':''}`]]});
    log(me(),'BUAT_KONTRAK','Kontrak',id,'','',F.no,'input manual'+(F.pic?'; PIC '+F.pic:''));
    closeKForm();S.f.st='OPEN';renderPage(false);setTimeout(()=>openDrawer(id),320);toast(`Kontrak ${id} didaftarkan.`);
  }else{
    const label={no:'No. kontrak',jenis:'Jenis dok',tahun:'Tahun',pop:'Populasi',pel:'Customer',end:'End customer',judul:'Judul',seg:'Segment',nilai:'Nilai',lok:'Jumlah lokasi',pic:'PIC'};
    const ch=Object.keys(data).filter(f=>String(data[f]??'')!==String(O[f]??''));
    if(!ch.length){closeKForm();toast('Tidak ada perubahan.');return;}
    if(ch.includes('no')){O.alias=O.alias||[];if(!O.alias.includes(O.no))O.alias.push(O.no);AMETA[normKey(O.no)]={sumber:'KOREKSI',waktu:nowTxt().replace(' Nov',' Nov 2026'),oleh:meName(),catatan:''};}
    const jc0=jenisCust(O);
    ch.forEach(f=>log(me(),'UBAH_KONTRAK','Kontrak',O.id,label[f],O[f]??'',data[f]??''));
    Object.assign(O,data);
    hist(O,`<b>${esc(meName())}</b> mengubah ${ch.map(f=>label[f]).join(', ')}${jc0!==jenisCust(O)?` · jenis customer ${jc0} → ${jenisCust(O)}`:''}`);
    closeKForm();refresh();toast('Data kontrak disimpan.');
  }
}

   [{l:'Batal'},{l:idx==null?'Tambah':'Simpan',pri:true,fn:d=>{
     const v=f=>d.querySelector(f).value.trim(),no=v('#ono');

     if(idx==null){k.orders.push(baru);log(me(),'TAMBAH_ORDER','OrderInternal',k.id,'',  '',baru.j+' '+no);hist(k,`<b>${esc(meName())}</b> menambah ${baru.j} <span class="mono">${esc(no)}</span>`);}

function bastModal(k,n){
  const b=k.bast.find(x=>x.n===n),dipilih=String(b.order||'').split(',').map(x=>x.trim()).filter(Boolean);
  const lain=k.bast.filter(x=>x!==b).reduce((a,x)=>a+(x.cak||0),0);
  modal(`Ubah ${k.id}-B${n}`,`<label class="of"><span>No. dokumen ${esc(b.doc)}</span><input class="inp mono" id="bdok" value="${esc(b.dok)}" placeholder="mis. BAST/TSAT/0418/2026"></label>
   <div><div class="eyebrow" style="margin-bottom:8px">Cakupan order</div>${k.orders.length?k.orders.map(o=>`<label class="row" style="gap:8px;font-size:13px;padding:3px 0"><input type="checkbox" class="chk" data-bo="${esc(o.no)}" ${dipilih.includes(o.no)?'checked':''}><span class="mono">${esc(o.j)} ${esc(o.no)}</span><span class="muted">${esc(o.lay)} · ${o.lok} lokasi</span></label>`).join(''):'<div class="muted" style="font-size:13px">Kontrak ini belum punya SO/MI. Tambahkan di tab Data kontrak.</div>'}</div>
   <div class="grid g2"><label class="of"><span>Cakupan lokasi</span><input class="inp tnum" id="bcak" type="number" min="0" value="${b.cak??''}"><small>${k.lok?`Kontrak ${k.lok} lokasi; BAST lain ${lain}`:'Kosongkan bila mencakup semua'}</small></label></div>
   <label class="of"><span>Daftar lokasi (opsional)</span><textarea class="inp" id="blist" placeholder="Satu lokasi per baris">${esc(b.lokasi||'')}</textarea></label>
   <label class="of"><span>Keterangan</span><input class="inp" id="bket" value="${esc(b.ket)}"><small>Keterangan BAST terbaru menjadi Kendala Detil bila tidak ada kendala aktif</small></label>`,
   [{l:'Batal'},{l:'Simpan',pri:true,fn:d=>{
     const cakRaw=d.querySelector('#bcak').value,cak=cakRaw===''?null:Number(cakRaw);
     if(cak!=null&&!(cak>=0&&Number.isInteger(cak))){toast('Cakupan lokasi harus bilangan bulat.');return false;}
     if(cak!=null&&k.lok&&lain+cak>k.lok){toast(`Total cakupan ${lain+cak} melebihi jumlah lokasi kontrak (${k.lok}).`);return false;}
     const order=[...d.querySelectorAll('[data-bo]:checked')].map(c=>c.dataset.bo).join(', ');
     const baru={dok:d.querySelector('#bdok').value.trim(),order,cak,lokasi:d.querySelector('#blist').value.trim(),ket:d.querySelector('#bket').value.trim()};
     const ch=Object.keys(baru).filter(f=>String(baru[f]??'')!==String(b[f]??''));
     if(!ch.length){toast('Tidak ada perubahan.');return;}
     const L={dok:'No. dokumen',order:'Cakupan order',cak:'Cakupan lokasi',lokasi:'Daftar lokasi',ket:'Keterangan'};
     ch.forEach(f=>log(me(),'UBAH_BAST','BAST',k.id+'-B'+n,L[f],b[f]??'',baru[f]??''));
     Object.assign(b,baru);hist(k,`<b>${esc(meName())}</b> mengubah ${ch.map(f=>L[f]).join(', ')} pada B${n}`);
     refresh();toast('BAST disimpan.');}}]);
}

/** Nomor lama yang cocok dengan kata pencarian (null bila cocok lewat nomor/judul biasa). */
function aliasCocok(k,q){
  if(!q||!(k.alias||[]).length)return null;
  const ql=q.toLowerCase(),qn=normKey(q);
  if((k.no+' '+k.pel+' '+k.end+' '+k.judul+' '+k.id).toLowerCase().includes(ql))return null;
  return k.alias.find(a=>a.toLowerCase().includes(ql)||(qn.length>=4&&normKey(a).includes(qn)))||null;
}
function cocokCari(k,q){
  const ql=q.toLowerCase(),qn=normKey(q);
  if((k.no+' '+k.pel+' '+k.end+' '+k.judul+' '+k.id).toLowerCase().includes(ql))return true;
  if(qn.length>=4&&normKey(k.no).includes(qn))return true;
  return !!aliasCocok(k,q);
}

  if(!d||isNaN(d))return {e:1};

  return hari<0?{e:2}:{v:d,hari};
}
const fmtTgl=d=>d?d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'';

function periksa(rows){
  const tahapL=TAHAP.map(t=>t.label),kendL=KREF.filter(x=>x.aktif).map(x=>x.label),seen={};
  const picBoleh=can('pic.atur');
  return rows.map(r=>{
    const o={baris:r.baris,raw:r,err:[],warn:[],info:[],st:'baru'};
    const v=f=>r[f]===undefined||r[f]===null?'':(r[f] instanceof Date?r[f]:String(r[f]).trim());
    o.no=v('no');o.judul=v('judul');
    if(!o.no){o.err.push('No. kontrak kosong');o.st='error';return o;}
    const nk=normKey(o.no);
    if(seen[nk]){o.err.push(`Nomor sama dengan baris ${seen[nk]} di file ini`);}else seen[nk]=r.baris;
    const ada=K.find(k=>normKey(k.no)===nk),lewatAlias=!ada&&K.find(k=>(k.alias||[]).some(a=>normKey(a)===nk));
    o.ada=ada||lewatAlias||null;o.viaAlias=!!lewatAlias;
    if(!o.ada&&!o.judul)o.err.push('Judul kontrak wajib diisi');
    // referensi
    o.jenis=v('jenis');if(o.jenis&&!cari(JENIS_DOK,o.jenis)){o.warn.push(`Jenis dok "${o.jenis}" tidak dikenal, ditebak dari nomor`);o.jenis='';}
    if(!o.jenis&&!o.ada){o.jenis=tebakJenis(o.no);if(o.jenis)o.info.push('Jenis dok ditebak: '+o.jenis);else o.warn.push('Jenis dok tidak bisa ditebak, dikosongkan');}
    o.tahun=v('tahun');if(o.tahun&&!/^(19|20)\d\d$/.test(o.tahun)){o.warn.push(`Tahun "${o.tahun}" tidak valid, dikosongkan`);o.tahun='';}
    o.pop=v('pop');if(o.pop&&!cari(POPS,o.pop)){o.warn.push(`Populasi "${o.pop}" belum ada di Referensi, dikosongkan`);o.pop='';}else if(o.pop)o.pop=cari(POPS,o.pop);
    o.seg=v('seg');if(o.seg&&!cari(SEGS,o.seg)){o.warn.push(`Segment "${o.seg}" belum ada di Referensi, dikosongkan`);o.seg='';}else if(o.seg)o.seg=cari(SEGS,o.seg);
    o.pel=v('pel');o.end=v('end');
    const n=bacaRupiah(r.nilai);if(n.e)o.err.push(`Nilai kontrak "${v('nilai')}" bukan angka`);else o.nilai=n.v;
    o.lok=v('lok');if(o.lok!==''&&!(Number(o.lok)>=1&&Number.isInteger(Number(o.lok))))o.err.push(`Jumlah lokasi "${o.lok}" harus bilangan bulat ≥ 1`);
    o.pic=v('pic');
    if(!picBoleh){if(o.pic&&o.pic!==meAlias())o.warn.push(`Kolom PIC diabaikan (butuh izin pic.atur); PIC sementara = Anda`);o.pic=o.ada?null:meAlias();}
    else if(o.pic&&!cari(PICS.concat(['omPik']),o.pic)){o.warn.push(`PIC "${o.pic}" tidak ada di Users → kontrak tanpa PIC`);o.pic='';}
    else if(o.pic)o.pic=cari(PICS.concat(['omPik']),o.pic);
    // BAST-1
    o.doc=v('doc');if(o.doc&&!cari(['BAST','BAA'],o.doc))o.err.push(`Dok tagih "${o.doc}" harus BAST atau BAA`);
    o.tahap=v('tahap');const t=o.tahap?cari(TAHAP,o.tahap,x=>x.label)||cari(TAHAP,o.tahap,x=>x.kode):TAHAP[0];
    if(!t)o.err.push(`Tahap "${o.tahap}" tidak ada. Pilihan: ${tahapL.join(', ')}`);else o.t=t;
    const tg=bacaTgl(r.tgl);if(tg.e)o.err.push(tg.e===2?'Tgl masuk tahap tidak boleh di masa depan':`Tgl masuk tahap "${v('tgl')}" tidak terbaca`);else{o.tgl=tg.v;o.hari=tg.v?tg.hari:0;}
    o.kend=v('kend');o.ket=v('ket');
    if(o.kend){const kd=cari(KREF,o.kend,x=>x.label)||cari(KREF,o.kend,x=>x.kode);if(!kd)o.err.push(`Kendala "${o.kend}" tidak ada. Pilihan: ${kendL.join(', ')}`);else{o.kd=kd;if(!o.ket)o.err.push('Keterangan kendala wajib diisi bila Kendala diisi');}}
    o.cat=v('cat');
    if(!o.ada){
      const jc=jenisCust({pel:o.pel,end:o.end});o.jc=jc;
      if(!o.pel)o.warn.push('Customer kosong → jenis customer BELUM TERDEFINISI (masuk "Data belum lengkap")');
      if(!o.end)o.warn.push('End customer kosong → jenis customer BELUM TERDEFINISI');
      o.docFinal=o.doc?o.doc.toUpperCase():({DIRECT:'BAA',INDIRECT:'BAST',BELUM:'BAST'})[jc];
    }
    o.st=o.err.length?'error':o.ada?'ada':o.warn.length?'peringatan':'baru';
    return o;
  });
}
const LBL_UP={no:'No. kontrak',judul:'Judul',jenis:'Jenis dok',tahun:'Tahun',pop:'Populasi',pel:'Customer',end:'End customer',seg:'Segment',nilai:'Nilai',lok:'Jumlah lokasi',pic:'PIC'};
/** Mode "Perbarui": hanya kolom yang diisi dan berbeda yang menimpa data SKM. */
function perubahan(o){
  if(!o.ada)return [];const k=o.ada,ch=[];
  ['judul','jenis','tahun','pop','pel','end','seg','nilai','lok','pic'].forEach(f=>{
    const baru=o[f];if(baru===''||baru==null)return;
    if(String(baru)!==String(k[f]??''))ch.push([f,k[f]??'',baru]);});
  return ch;
}
function periksaSO(so,rows){
  const okNo={},seenO={};rows.forEach(o=>{if(o.st!=='error')okNo[normKey(o.no)]=o;});
  const errNo={};rows.forEach(o=>{const nk=normKey(o.no);if(o.st==='error'&&o.no&&!okNo[nk]&&!errNo[nk])errNo[nk]=o.baris;});
  return so.map(r=>{
    const s={baris:r.baris,no:String(r.no||'').trim(),j:String(r.j||'').trim().toUpperCase(),ono:String(r.ono||'').trim(),lay:r.lay||'',pek:r.pek||'',lok:r.lok||'',ket:r.ket||'',err:[]};
    const nk=normKey(s.no);
    if(!s.no)s.err.push('No. kontrak kosong');
    else if(errNo[nk])s.err.push(`Kontraknya error di baris ${errNo[nk]} tab Kontrak, ikut tidak disimpan`);
    else if(!okNo[nk]&&!K.some(k=>normKey(k.no)===nk||(k.alias||[]).some(a=>normKey(a)===nk)))s.err.push('No. kontrak tidak ada di tab Kontrak maupun di SKM');
    if(!['SO','MI'].includes(s.j))s.err.push(`Jenis "${r.j||''}" harus SO atau MI`);
    if(!s.ono)s.err.push('No. order kosong');
    else{const ok=normKey(s.ono);if(seenO[ok])s.err.push(`No. order sama dengan baris ${seenO[ok]}`);else seenO[ok]=s.baris;
      const pemilik=K.find(k=>k.orders.some(x=>normKey(x.no)===ok));if(pemilik&&normKey(pemilik.no)!==nk)s.err.push(`No. order sudah dipakai ${pemilik.id}`);}
    s.st=s.err.length?'error':'ok';s.k=okNo[nk];return s;
  });
}

async function bacaFile(buf,nama){
  if(!window.XLSX){toast('Pustaka pembaca Excel belum termuat. Periksa koneksi internet lalu coba lagi.');return;}
  let wb;try{wb=XLSX.read(buf,{type:'array',cellDates:true});}catch(e){toast('File tidak bisa dibaca sebagai Excel (.xlsx).');return;}
  const ambil=(nama,def,wajib)=>{
    const sn=wb.SheetNames.find(n=>n.toLowerCase()===nama)||(nama==='kontrak'?wb.SheetNames.find(n=>{const h=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1})[0]||[];return petaKolom(h,def).no!==undefined;}):null);
    if(!sn)return null;
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}),m=petaKolom(aoa[0]||[],def);
    if(wajib&&(m.no===undefined))return {salah:true};
    return aoa.slice(1).map((row,i)=>{const o={baris:i+2};Object.keys(m).forEach(f=>o[f]=row[m[f]]);return o;}).filter(o=>Object.keys(def).some(f=>o[f]!==''&&o[f]!==undefined));
  };
  const rows=ambil('kontrak',KOL_UP,true);
  if(!rows||rows.salah){modal('Bukan template SKM',`<div class="note warn">${ic('warn','s')}<span class="tx">Tidak ada tab <b>Kontrak</b> dengan kolom <b>No. Kontrak</b> di file <span class="mono">${esc(nama)}</span>. Unduh template dari halaman ini, isi, lalu upload lagi.</span></div><div class="muted" style="font-size:12px">Sheet FF format lama (kolom NO WO/SPK/KL, STATUS AWAL, …) dibaca lewat Import data lama di F3.</div>`,[{l:'Mengerti',pri:true}]);return;}
  if(!rows.length){toast('Tab Kontrak masih kosong.');return;}
  if(rows.length>1000){toast(`File berisi ${rows.length} baris. Maksimal 1.000 per upload; pecah jadi beberapa file.`);return;}
  const so=ambil('so_mi',KOL_SO,false)||[];
  const U=S.up;U.file=nama;U.rowsRaw=rows;U.soRaw=so;U.step=3;U.f='all';U.tab='kontrak';hitungUlang();renderPage(false);
}
function hitungUlang(){const U=S.up;U.rows=periksa(U.rowsRaw);U.so=periksaSO(U.soRaw,U.rows);}

  return {total:r.length,baru:c('baru'),warn:c('peringatan'),ada:ada.length,upd,lewat:ada.length-upd,err:c('error'),
    soOk:U.so.filter(s=>s.st==='ok').length,soErr:U.so.filter(s=>s.st==='error').length};
}

    if(o.st==='error'){hasil.gagal++;return;}
    if(o.st==='ada'){
      const ch=U.mode==='perbarui'?perubahan(o):[];if(!ch.length){hasil.dilewati++;return;}
      const k=o.ada,jc0=jenisCust(k);ch.forEach(([f,a,b])=>{log(me(),'UBAH_KONTRAK','Kontrak',k.id,LBL_UP[f],a,b,sumberTxt+' baris '+o.baris);k[f]=f==='nilai'||f==='lok'||f==='tahun'?Number(b):b;});
      hist(k,`<b>${esc(meName())}</b> memperbarui ${ch.map(c=>LBL_UP[c[0]]).join(', ')} lewat ${esc(sumberTxt)}${jc0!==jenisCust(k)?` · jenis customer ${jc0} → ${jenisCust(k)}`:''}`);
      hasil.diperbarui.push(k.id);return;
    }
    const id='K-'+String(K.length+1).padStart(6,'0'),orders=U.so.filter(s=>s.st==='ok'&&s.k===o).map(s=>({j:s.j,no:s.ono,lay:s.lay,pek:s.pek,lok:Number(s.lok)||0}));
    hasil.so+=orders.length;
    const k={id,no:o.no,jenis:o.jenis,tahun:o.tahun?Number(o.tahun):null,pop:o.pop,pel:o.pel,end:o.end,judul:o.judul,seg:o.seg,nilai:o.nilai??null,lok:o.lok===''?null:Number(o.lok),pic:o.pic||'',verif:false,sumber:'UPLOAD',alias:[],orders,
      bast:[{n:1,doc:o.docFinal,t:o.t.kode,s:1,cak:null,order:orders.map(x=>x.no).join(', '),hari:o.hari||0,ket:o.cat||'Dibuat dari upload Excel',dok:''}],
      kend:o.kd?[{id:'KD-U'+id.slice(-4),b:1,j:o.kd.kode,ket:o.ket,st:'AKTIF',hari:o.hari||0,oleh:meName()}]:[],
      hist:[[nowTxt(),`<b>${esc(meName())}</b> mendaftarkan kontrak lewat ${esc(sumberTxt)} (baris ${o.baris}) dan membuat BAST-1 (${o.docFinal})`]]};
    K.push(k);hasil.dibuat.push(id);
    log(me(),'BUAT_KONTRAK','Kontrak',id,'','',o.no,sumberTxt+' baris '+o.baris+(o.warn.length?'; '+o.warn.length+' peringatan':''));
  });
  // SO/MI untuk kontrak yang sudah ada
  U.so.filter(s=>s.st==='ok'&&!s.k).forEach(s=>{const k=K.find(x=>normKey(x.no)===normKey(s.no)||(x.alias||[]).some(a=>normKey(a)===normKey(s.no)));if(k&&U.mode==='perbarui'){k.orders.push({j:s.j,no:s.ono,lay:s.lay,pek:s.pek,lok:Number(s.lok)||0});hasil.so++;}});
  log(me(),'UPLOAD_EXCEL','Kontrak','—','','','',`${U.file}: ${hasil.dibuat.length} dibuat, ${hasil.diperbarui.length} diperbarui, ${hasil.dilewati} dilewati, ${hasil.gagal} error`);
  U.hasil=hasil;U.step=4;renderPage(false);toast(`${hasil.dibuat.length} kontrak dibuat${hasil.diperbarui.length?', '+hasil.diperbarui.length+' diperbarui':''}.`);
}
function bindUpload(){
  const U=S.up,$=s=>document.querySelector('#content '+s),$$=s=>document.querySelectorAll('#content '+s);
  const f=$('#upFile'),drop=$('#drop');
  if(f)f.onchange=async()=>{const x=f.files[0];if(x)bacaFile(await x.arrayBuffer(),x.name);};
  if(drop){['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop',async ev=>{const x=ev.dataTransfer.files[0];if(x)bacaFile(await x.arrayBuffer(),x.name);});
    drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f.click();}};}
  if($('#coba'))$('#coba').onclick=()=>{const bin=atob(CONTOH_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);bacaFile(u.buffer,'Contoh_Upload_Kontrak.xlsx');};
  $$('[data-dlmock]').forEach(a=>a.onclick=e=>{e.preventDefault();toast('(Mockup) File '+a.dataset.dlmock+' dikirim terpisah di chat. Di aplikasi, tombol ini langsung mengunduh template terbaru.');});
  $$('[data-uf]').forEach(b=>b.onclick=()=>{U.f=b.dataset.uf;U.tab='kontrak';renderPage(false);});
  $$('[data-mode]').forEach(b=>b.onclick=()=>{U.mode=b.dataset.mode;renderPage(false);});
  $$('[data-utab]').forEach(b=>b.onclick=()=>{U.tab=b.dataset.utab;renderPage(false);});
  $$('[data-openk]').forEach(b=>b.onclick=e=>{e.stopPropagation();openDrawer(b.dataset.openk);});
  if($('#ganti'))$('#ganti').onclick=()=>{U.step=1;renderPage(false);};
  if($('#lagi'))$('#lagi').onclick=()=>{S.up={step:1,file:'',rows:[],so:[],mode:'lewati',f:'all',tab:'kontrak',hasil:null};renderPage(false);};
  if($('#toList'))$('#toList').onclick=()=>{S.f.st='OPEN';S.f.q='';location.hash='#kontrak';};
  if($('#dlErr'))$('#dlErr').onclick=unduhLaporan;
  if($('#upSave'))$('#upSave').onclick=()=>{
    const R=ringkas(),n=R.baru+R.warn+R.upd,b=$('#upSave');
    modal('Simpan hasil upload?',`<div>${R.baru+R.warn} kontrak baru${R.upd?`, ${R.upd} kontrak diperbarui`:''}, ${R.soOk} SO/MI.${R.err?` <b>${R.err}</b> baris error tidak disimpan.`:''}</div><div class="muted" style="font-size:12px">Disimpan bertahap per 50 baris. Bila koneksi terputus di tengah, upload file yang sama lagi: yang sudah tersimpan terbaca "Sudah ada".</div>`,
      [{l:'Batal'},{l:`Simpan ${n} kontrak`,pri:true,fn:()=>{b.disabled=true;b.innerHTML='<span class="bspin"></span>Menyimpan…';setTimeout(simpanUpload,900);}}]);
  };
}

renderPage(true);
</script>
